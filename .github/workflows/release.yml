name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache the offline voice engine
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-b5454-models-v1

      - name: Install dependencies
        run: npm ci

      - name: Download the offline voice engine and models
        run: npm run setup:voice

      - name: Run unit tests
        run: npm run test:ci

      - name: Desktop smoke test
        run: npm run smoke

      - name: Build the installer
        run: npm run dist

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding utf8

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
